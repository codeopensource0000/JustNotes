# Only the rules where this project's own shape differs from detekt's defaults.
# Everything else comes from the bundled default config
# (buildUponDefaultConfig = true), so this file stays short enough to read.

complexity:
  LongMethod:
    # Compose screens are one long declarative function by design; splitting
    # them for a line count rather than for a reason makes them worse.
    excludes: ['**/ui/screens/**', '**/ui/components/**']
  LongParameterList:
    # Same: a composable taking eight callbacks is a screen's contract, not a
    # smell.
    excludes: ['**/ui/screens/**', '**/ui/components/**']

  TooManyFunctions:
    # A repository interface is a list of operations — its method count is its
    # contract, not a smell. Same for an object that wraps one subsystem.
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    # A class implementing a 14-method interface has 14 methods. The default
    # of 11 is kept for everything else, where it still catches the real
    # case — NoteEditorViewModel and its 27.
    thresholdInClasses: 20

style:
  MagicNumber:
    # dp values, colour channels and durations are magic numbers by nature in
    # a UI layer.
    excludes: ['**/ui/**', '**/test/**', '**/androidTest/**']
  MaxLineLength:
    maxLineLength: 120

  ReturnCount:
    # Guard clauses are the point of an early return; counting them as
    # complexity punishes the clearest way to write a precondition.
    excludeGuardClauses: true

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention, and test functions
    # are `written as sentences in backticks` — which is the idiomatic Kotlin
    # way to name them, not a slip.
    excludes: ['**/ui/**', '**/test/**', '**/androidTest/**']

exceptions:
  TooGenericExceptionCaught:
    # VoskModelManager.install() catches Exception on purpose: anything
    # escaping used to pin the state at INSTALLING forever. The rule is right
    # in general, so it stays on everywhere else.
    excludes: ['**/stt/**']

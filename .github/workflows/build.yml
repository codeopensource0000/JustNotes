name: build

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run rather than letting two builds of the same branch
# queue up: each checkout drags ~80 MB of bundled speech models.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # No signing key on CI, and that is deliberate: keystore.properties is
      # absent, so assembleDebug works and any release build here would come
      # out unsigned. Publishing is done from a machine that holds the key.
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon

      # Room rewrites app/schemas/<version>.json on every build, silently and
      # without a warning. So a developer who changes an entity and forgets to
      # bump @Database(version) gets a *rewritten* reference schema — and every
      # runtime check comparing code to that file compares it to itself.
      #
      # The real invariant is a property of the history, not of a running
      # database: a schema file that has been committed must never change
      # again. Only git can say that, which is why this lives here and not in
      # a test. Runs after the build, which is what regenerates the files.
      - name: Committed Room schemas must not have changed
        run: |
          if ! git diff --exit-code -- app/schemas; then
            echo "::error::A committed Room schema was rewritten. An entity changed without @Database(version) being bumped: raise the version and commit the new schema file alongside the old one."
            exit 1
          fi

      # Separate step so a style regression is distinguishable at a glance
      # from a failing test. Fails only on findings absent from
      # config/detekt-baseline.xml — the known debt stays silent.
      - name: Static analysis
        run: ./gradlew detekt --no-daemon

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/detekt.html
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
